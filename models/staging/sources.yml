version: 2

sources:
  - name: raw_data
    database: super-hero-llc
    schema: raw_data
    tables:
      - name: paid_social_native
        description: "Native BigQuery copy of the all_data Google Sheet — campaign performance data"
        columns:
          - name: string_field_0
            description: "Date of the campaign record"
          - name: string_field_1
            description: "Campaign name"
          - name: string_field_2
            description: "Spend amount"
          - name: string_field_3
            description: "Number of impressions"
          - name: string_field_4
            description: "Number of clicks"

      - name: paid_search_native
        description: "Paid search data from Google Sheets"
        columns:
          - name: date
            description: "Date of the campaign record"
          - name: campaign_name
            description: "Campaign name"
          - name: spend
            description: "Spend amount"
          - name: impressions
            description: "Number of impressions"
          - name: clicks
            description: "Number of clicks"